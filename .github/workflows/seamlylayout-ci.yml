name: SeamlyLayout CI

# ---------------------------------------------------------------------------
# Task 20 — push-triggered CI that builds and tests the SeamlyLayout daughter
# app (Rust core + Qt 6.11 QML frontend), mirroring what `src/app/seamlylayout/
# qd.ps1` / `build.ps1` do locally, adapted to Linux/CI.
#
# WHY A SEPARATE WORKFLOW FROM ci.yml:
#   Task 30 removed the original reason — the Qt pin. This job used to carry a
#   Qt 6.10.1 pin while `ci.yml` built seamly2d/seamlyme on a different release;
#   both are now Qt 6.11.1, so the two `QT_VERSION` values must simply be kept
#   in step. The workflow stays separate for the reasons that remain true:
#     * Different build system — SeamlyLayout is CMake/Ninja + Cargo/Corrosion,
#       while ci.yml's parent-app jobs are qmake, and it needs extra toolchain
#       steps (Rust, the cargo cache, the qtwebengine/qtwebchannel/qtpositioning
#       module set) that no parent-app job wants.
#     * Independent triggers — this file is path-filtered to
#       `src/app/seamlylayout/**` plus `src/test/SeamlyLayoutTest/**` (where
#       Task 58 moved the Qt/C++ test suites), so layout-only changes do not
#       rebuild the parent apps on every platform, and parent-only changes do
#       not rebuild the Rust workspace.
#     * Independent failure — a SeamlyLayout failure never blocks the
#       seamly2d/seamlyme jobs, and vice versa.
#   Merging is therefore a "could", not a "should"; revisit it only if the
#   parent apps also move to CMake.
#
# KEEP IN SYNC: `QT_VERSION` below and `ci.yml`'s `QT_VERSION` must name the
# same Qt release — the family now ships one shared Qt runtime (Task 30).
# ---------------------------------------------------------------------------

on:
  # Primary trigger: run whenever SeamlyLayout sources land on the integration
  # branches. Push is restricted to those branches (task branches are covered by
  # the pull_request trigger below) so a same-repo PR does not build twice.
  push:
    branches:
      - develop
      - run-seamlyLayout
    paths:
      - 'src/app/seamlylayout/**'
      # Task 58 moved the Qt/C++ test suites here, out of the app tree; without
      # this entry a test-only change would trigger no CI at all.
      - 'src/test/SeamlyLayoutTest/**'
      - '.github/workflows/seamlylayout-ci.yml'
  # Every task branch reaches run-seamlyLayout via a pull request, so this trigger
  # gives task-branch pushes their build/test coverage without duplicate runs.
  pull_request:
    paths:
      - 'src/app/seamlylayout/**'
      - 'src/test/SeamlyLayoutTest/**'
      - '.github/workflows/seamlylayout-ci.yml'
  workflow_dispatch:

# Only the newest run per ref matters; cancel superseded in-progress runs.
concurrency:
  group: seamlylayout-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SeamlyLayout's required Qt — must match qt_frontend/CMakeLists.txt's
  # `find_package(Qt6 6.11.1 ...)` and stay in sync with ci.yml's QT_VERSION
  # (Task 30: one Qt for the whole family).
  # Quoted, or the YAML parser reads it as a float.
  QT_VERSION: '6.11.1'

jobs:

  build-and-test:
    name: 'Linux: Build & test SeamlyLayout (Qt 6.11)'
    runs-on: ubuntu-latest
    # Run every step from the SeamlyLayout app root — this is the Cargo workspace
    # root and the parent of qt_frontend, matching how qd.ps1 is invoked locally.
    defaults:
      run:
        working-directory: src/app/seamlylayout

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -------------------------------------------------------------------
      # Toolchain: Rust (stable) for the core crates + CXX-Qt bridge, and
      # Qt 6.11 with the QML/Quick + WebEngine modules the frontend needs.
      # -------------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        # Caches the Cargo registry and the workspace target dir, keyed on
        # Cargo.lock, to keep incremental CI builds fast.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          # qtwebengine is required by qt_frontend (SvgCanvas.qml's WebEngineView
          # and main.cpp's QtWebEngineQuick::initialize()). aqtinstall does NOT
          # auto-resolve a module's Qt dependencies, so qtwebengine's own deps
          # must be listed explicitly: Qt6WebEngineCore requires Qt6WebChannel
          # (qtwebchannel) and Qt6Positioning (qtpositioning) at configure time —
          # omitting them makes find_package(Qt6 ... WebEngineQuick) fail. Quick,
          # QuickControls2 and QuickDialogs2 ship inside the default qtdeclarative
          # archive, so they need not be listed here.
          modules: qtwebengine qtwebchannel qtpositioning

      - name: Install build tools
        # Ninja drives the CMake presets (qt_frontend/CMakePresets.json).
        # xvfb provides a virtual display for the Qt GUI unit tests.
        # The libnss3/xkbcommon/gbm libs satisfy Qt WebEngine's link-time
        # dependencies; the remaining X/GL deps come from the runner image and
        # install-qt-action's install-deps.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libnss3 libxkbcommon0 libgbm1

      # -------------------------------------------------------------------
      # Build the Qt 6.11 QML frontend. The CMake build also drives Corrosion /
      # cxx-qt-cmake, which runs `cargo build` for the cxxqt_bridge crate — so
      # this single step builds both the Rust bridge and the C++/QML app, the
      # same way build.ps1 does on Windows.
      # -------------------------------------------------------------------
      - name: Configure and build (Qt frontend + Rust bridge)
        working-directory: src/app/seamlylayout/qt_frontend
        run: |
          cmake --preset debug -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build --preset debug

      # -------------------------------------------------------------------
      # Run the two unit-test suites Task 20 calls for.
      # -------------------------------------------------------------------
      - name: Run Qt frontend tests (ctest)
        working-directory: src/app/seamlylayout/qt_frontend
        # The AdjustScene/AdjustController suites force QT_QPA_PLATFORM=offscreen
        # via CMake; PreferencesModel/SettingsModel link Qt Widgets and want a
        # display, so run the whole suite under xvfb to cover both.
        run: xvfb-run -a ctest --preset debug --output-on-failure

      - name: Run Rust workspace tests (cargo)
        # cxx-qt-build locates Qt through qmake, which install-qt-action put on
        # PATH; QMAKE is exported as a belt-and-braces fallback.
        env:
          QMAKE: qmake
        run: cargo test --workspace
