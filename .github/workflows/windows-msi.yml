name: Windows MSI

# ---------------------------------------------------------------------------
# build the Windows MSI installer that ships the whole Seamly app
# family: seamly2d + seamlyme (qmake) and SeamlyLayout (Rust + CMake), all
# against ONE Qt release, packaged per architecture (x64 and arm64) with the
# WiX toolset from scripts/packaging/windows/seamly-family.wxs via
# scripts/packaging/windows/smsi.ps1.
#
# ONE Qt FOR THE WHOLE FAMILY (Task 30):
#   This job used to install two Qt kits — ci.yml's for the parent apps and a
#   separate Qt 6.10.1 for SeamlyLayout — in a carefully ordered dance, because
#   Qt's DLL and tool names are identical across releases and a second kit on
#   PATH made the parent `qmake` bind to the wrong one. SeamlyLayout now builds
#   against the same Qt 6.11.1 as the parents, so there is a single install
#   step, no ordering hazard, and the MSI ships one shared Qt runtime instead
#   of two side-by-side copies.
#
# WHY A SEPARATE WORKFLOW FROM ci.yml:
#   Same reasoning as seamlylayout-ci.yml: the MSI needs BOTH build
#   systems in one job — qmake for the parent apps plus Rust + CMake/Ninja for
#   SeamlyLayout — and it should not slow down or destabilize every ci.yml run.
#   ci.yml's NSIS installer remains the released Windows installer until the
#   MSI replaces it; at that point fold these steps into ci.yml's windows job
#   and wire the .msi into the publish job's release files.
#
# ARM64:
#   seamly2d/seamlyme cross-compile for arm64 exactly as in ci.yml's windows
#   matrix. SeamlyLayout has no arm64 build yet (its Rust + cxx-qt cross story
#   is documented in .github/README-BUILDS.md), so the arm64 MSI ships the two
#   parent apps only (-NoSeamlyLayout) until that lands.
# ---------------------------------------------------------------------------

on:
  # The MSI only needs rebuilding when the packaging inputs change; app-code
  # coverage stays with ci.yml / seamlylayout-ci.yml. workflow_dispatch covers
  # on-demand builds (e.g. producing an installer for manual testing).
  push:
    branches:
      - develop
      - run-seamlyLayout
    paths:
      - 'scripts/packaging/windows/**'
      - '.github/workflows/windows-msi.yml'
  pull_request:
    paths:
      - 'scripts/packaging/windows/**'
      - '.github/workflows/windows-msi.yml'
  workflow_dispatch:

# Only the newest run per ref matters; cancel superseded in-progress runs.
concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The one Qt release the whole family builds against (Task 30) — keep in sync
  # with ci.yml's and seamlylayout-ci.yml's QT_VERSION, and with
  # src/app/seamlylayout/qt_frontend/CMakeLists.txt's find_package(Qt6 ...).
  QT_VERSION: '6.11.1'

jobs:

  msi:
    name: 'Windows: Build MSI (${{ matrix.arch }})'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # qt-modules: qtmultimedia is required by the parent apps on every
          # arch. The x64 leg also builds SeamlyLayout, which needs qtwebengine
          # (SvgCanvas.qml's WebEngineView) plus its own dependencies
          # qtwebchannel/qtpositioning — aqtinstall does not auto-resolve a
          # module's Qt dependencies, and without them find_package(Qt6 ...
          # WebEngineQuick) fails at configure time. The arm64 leg omits them:
          # it builds no SeamlyLayout (-NoSeamlyLayout) and Qt ships no
          # cross-compiled arm64 WebEngine.
          - arch: x64
            msvc-arch: x64
            qt-arch: win64_msvc2022_64
            qmake: qmake
            qt-modules: qtmultimedia qtwebengine qtwebchannel qtpositioning
          - arch: arm64
            msvc-arch: amd64_arm64
            qt-arch: win64_msvc2022_arm64_cross_compiled
            qmake: host-qmake
            qt-modules: qtmultimedia

    steps:
      - uses: actions/checkout@v7

      # Same rolling-release version scheme as ci.yml's version job.
      - name: create version number
        shell: bash
        run: echo "VERSION_NUMBER=$(date +%Y.%-m.%-d.%-H%M)" >> $GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ONE Qt install for every app in the package (Task 30). Before the whole
      # family shared a Qt release this step installed only the parents' kit and
      # a second install-qt-action step added SeamlyLayout's afterwards, in that
      # order — installing both up front let the parent `qmake` resolve to the
      # wrong kit ("Unknown module(s) in QT: multimedia"). With a single kit
      # that hazard is gone: bare `qmake`/`nmake`/`windeployqt` and the explicit
      # $env:QT_ROOT_DIR references below all name the same Qt.
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: ${{ matrix.qt-modules }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # same pin as ci.yml — remove once aqtinstall 3.4.0 is released

      - name: update version
        shell: bash
        run: ./scripts/version.sh ${VERSION_NUMBER}

      # Identical to ci.yml's windows job build step; the .pro post-link runs
      # windeployqt, so each app's bin\ ends up install-ready. Only the parent
      # Qt is on PATH here, so bare `qmake`/`windeployqt` resolve to it.
      - name: make seamly2d.exe and seamlyme.exe
        run: |
          ${{ matrix.qmake }} Seamly.pro -config release CONFIG+=noTests
          nmake

      # ------------------- SeamlyLayout (x64 only) -------------------------
      # No second Qt install here any more (Task 30) — SeamlyLayout builds
      # against the same $env:QT_ROOT_DIR kit installed above.
      - name: Install Rust toolchain (x64 only)
        if: matrix.arch == 'x64'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build (x64 only)
        if: matrix.arch == 'x64'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout

      - name: Install Ninja (x64 only)
        if: matrix.arch == 'x64'
        run: choco install ninja -y

      # Mirrors seamlylayout-ci.yml's build step (and the local release build):
      # one CMake build produces the Rust bridge (Corrosion/cxx-qt) and the
      # C++/QML app. The MSVC environment comes from msvc-dev-cmd above.
      - name: Build SeamlyLayout release (x64 only)
        if: matrix.arch == 'x64'
        working-directory: src/app/seamlylayout/qt_frontend
        shell: pwsh
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------- package ------------------------------------------
      # Pinned to WiX v6: v7 (July 2026) refuses to run until an Open Source
      # Maintenance Fee (OSMF) EULA is accepted (error WIX7015), which is a
      # policy decision this project has not made — v6 is the newest line
      # without that gate. The UI extension version must match the core tool.
      - name: Install WiX toolset (v6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version '6.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixVer = (wix --version).ToString().Split('+')[0]
          wix extension add --global WixToolset.UI.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Util supplies RemoveFolderEx, used to remove the old NSIS
          # installation's directory tree and Start Menu folder.
          wix extension add --global WixToolset.Util.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI (x64 - all three apps)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          .\scripts\packaging\windows\smsi.ps1 -Arch x64 -Version $env:VERSION_NUMBER `
            -Seamly2DBin src\app\seamly2d\bin `
            -SeamlyMeBin src\app\seamlyme\bin `
            -WinDeployQt6 "$env:QT_ROOT_DIR\bin\windeployqt6.exe"

      - name: Build MSI (arm64 - seamly2d and seamlyme)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          .\scripts\packaging\windows\smsi.ps1 -Arch arm64 -Version $env:VERSION_NUMBER `
            -Seamly2DBin src\app\seamly2d\bin `
            -SeamlyMeBin src\app\seamlyme\bin `
            -NoSeamlyLayout

      # ------------------- sign (main builds only) --------------------------
      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Set up Java (for signing)
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # jsign signs MSI files the same way it signs the NSIS exe in ci.yml.
      - name: Sign the MSI
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          scripts/seamly-msi/${{ matrix.arch }}/Seamly2D-${{ matrix.arch }}.msi

      - uses: actions/upload-artifact@v7
        with:
          name: seamly-${{ matrix.arch }}.msi
          path: scripts/seamly-msi/${{ matrix.arch }}/seamly-${{ matrix.arch }}.msi
          if-no-files-found: error
