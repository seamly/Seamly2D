name: CI

# for a description, see README.md in this folder

on:
  schedule:
    - cron: '30 1 * * MON'
  workflow_dispatch:
  push:
    branches:
    - develop
    - run-seamlyLayout
    - 'feat-*'
  pull_request:

permissions:
  contents: write

env:
  QT_VERSION: '6.11.1' # quotes required or YAML parser will interpret as float

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.create-version.outputs.version_number }}

    # The version number is YYYY.MM.DD.hhmm to create simple, easy-to-read "rolling release" versioning
    # for pull requests before merge keep a static version number
    steps:
      - name: create version number
        id: create-version
        run: |
          echo "version_number=$(date +%Y.%-m.%-d.%-H%M)" >> $GITHUB_OUTPUT

  linux-test:
    if: github.event_name == 'pull_request'
    name: 'Linux: Run unit tests'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: install build dependencies
        run: |
          sudo apt update && sudo apt install -y libxerces-c-dev

      - name: build Seamly2D & SeamlyMe for tests
        run: |
          qmake Seamly.pro
          make -j$(nproc)

      - name: install test dependencies
        # xvfb use to test built application within a framebuffer
        run: |
          sudo apt update
          sudo apt install -y xvfb gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-0

      - name: run Seamly2D tests
        run: |
          xvfb-run -a make check

  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Linux: Build AppImage'
    runs-on: ubuntu-22.04
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install appimage dependencies
        run: |
          sudo apt update && sudo apt install -y libfuse2
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: install build dependencies
        run: |
          sudo apt update
          # install poppler-utils for pdftops, gstreamer1.0-plugins-base for QtMultimedia
          # install libxerces for xml manipulation
          sudo apt install -y poppler-utils gstreamer1.0-plugins-base libxerces-c-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: build Seamly2D appimage
        env:
          OUTPUT: Seamly2D-x86_64.AppImage  # linuxdeploy-x86_64.AppImage uses this env var as name for AppImage
        run: |
          qmake -config release CONFIG+=noTests
          make -j$(nproc)
          make INSTALL_ROOT=`pwd`/AppDir install

          cp /usr/bin/pdftops AppDir/usr/bin
          mkdir -p AppDir/usr/share/X11/xkb
          cp -r /usr/share/X11/xkb/* AppDir/usr/share/X11/xkb
          linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file=dist/seamly2d.desktop --plugin qt --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-x86_64.AppImage
          path: Seamly2D-x86_64.AppImage
          if-no-files-found: error


  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'macOS: Build'
    runs-on: macos-26
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install build dependencies
        run: |
          brew install xerces-c

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: setup signing and notarization
        env:
          KEYCHAIN_FILE: ~/seamly2d.keychain
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        if: ${{ env.APPLE_SIGN_IDENTITY }}
        run: |
          security create-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security unlock-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security set-keychain-settings $KEYCHAIN_FILE
          security list-keychains -d user -s $KEYCHAIN_FILE
          echo '${{ secrets.apple_sign_certificate }}' | base64 -d -o ~/seamly2d.p12
          security import ~/seamly2d.p12 -k $KEYCHAIN_FILE -T /usr/bin/codesign -P ${{ secrets.apple_sign_certificate_password }}
          security set-key-partition-list -S apple-tool:,apple: -s -k ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          echo "APPLE_SIGN_IDENTITY=${{ secrets.apple_sign_identity }}" >> $GITHUB_ENV

          mkdir -p ~/private_keys/
          echo '${{ secrets.apple_notarize_key_content }}' > ~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8
          echo "APPLE_NOTARIZE_KEY=~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_KEY_ID=${{ secrets.apple_notarize_key_id }}" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_ISSUER_ID=${{ secrets.apple_notarize_issuer_id }}" >> $GITHUB_ENV

      - name: make Seamly2D for macos
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        run: |
          # see https://github.com/actions/runner-images/issues/7522
          echo killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
          # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
          if [ -n "$APPLE_SIGN_IDENTITY" ] ; then
            qmake Seamly.pro -config release CONFIG+=noTests CONFIG+=macSign
          else
            qmake Seamly.pro -config release CONFIG+=noTests
          fi
          make -j$(sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-macos.zip
          path: out/Seamly2D-macos.zip
          if-no-files-found: error

  # NSIS installer, ARM64 ONLY (Task Installer.1.1).
  #
  # The x64 leg of this matrix used to build `Seamly2D-windows.zip` — an NSIS
  # installer carrying seamly2d + seamlyme. It is gone: the `windows-msi` job
  # below now produces the x64 Windows installer as a WiX MSI that additionally
  # ships SeamlyLayout, and the publish job releases that .msi in its place.
  # ARM64 keeps NSIS until Task Installer.1.2 gives it an MSI of its own (there
  # is still no arm64 SeamlyLayout build, so an arm64 MSI would ship two apps).
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Build NSIS installer (arm64)'
    runs-on: windows-2022
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}
    strategy:
      matrix:
        include:
          - msvc-arch: amd64_arm64
            qt-arch: win64_msvc2022_arm64_cross_compiled
            qmake: host-qmake
            release-file: Seamly2D-win-arm64.zip

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc-arch }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: qtmultimedia
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      - name: update version
        shell: bash
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: make seamly2d.exe and seamlyme.exe
        run: |
          ${{ matrix.qmake }} Seamly.pro -config release CONFIG+=noTests
          nmake

      - name: install NSIS
        run: choco install nsis -y

      - name: create seamly2d-installer.exe
        # copy seamly2d and seamlyme directory trees prepared by windeployqt and create installer
        # uses parameters in seamly2d-installer.nsi to create the installer exe
        run: |
          mkdir windows-build
          Copy-Item -Path 'src\app\seamly2d\bin\*' -Destination windows-build -Recurse
          Copy-Item -Path 'src\app\seamlyme\bin\*' -Destination windows-build -Recurse -Force
          Copy-Item -Path dist\seamly2d-installer.nsi -Destination windows-build
          cd windows-build
          & 'C:\Program Files (x86)\NSIS\makensis.exe' seamly2d-installer.nsi

      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Set up Java (for signing)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Sign executables
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          windows-build/Seamly2D-installer.exe

      - name: Print installer signature
        run: |
          Get-AuthenticodeSignature windows-build\Seamly2D-installer.exe

      - name: pack installer file into .zip
        run: |
          cd windows-build
          C:\"Program Files"\7-Zip\7z.exe a ${{ matrix.release-file }} Seamly2D-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release-file }}
          path: windows-build/${{ matrix.release-file }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows x64 MSI (Task Installer.1.1)
  #
  # The released x64 Windows installer. Unlike the NSIS package it replaces, one
  # MSI carries the WHOLE Seamly app family — seamly2d + seamlyme (qmake) and
  # SeamlyLayout (Rust + CMake/Ninja) — against ONE Qt 6.11.1 runtime, built by
  # scripts/packaging/windows/smsi.ps1 from seamly-family.wxs with WiX v6.
  #
  # WHY THE STEPS ARE INLINE HERE rather than reused from windows-msi.yml:
  # the publish job below releases this .msi, so the package has to be built
  # from the same commit, in the same run, as every other release artifact.
  # windows-msi.yml stays as it is — a path-filtered workflow that rebuilds the
  # package on its own when only the packaging inputs change, without dragging
  # the whole of CI along. The two must be kept in step; the build steps below
  # are its x64 leg verbatim.
  #
  # This job needs BOTH build systems in one runner (qmake AND CMake/Cargo),
  # which is why it is a job of its own rather than a leg of the windows matrix.
  # ---------------------------------------------------------------------------
  windows-msi:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Build MSI (x64)'
    runs-on: windows-2022
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # ONE Qt install for all three apps (Task 30). qtwebengine is required by
      # SeamlyLayout's SvgCanvas.qml (WebEngineView); qtwebchannel and
      # qtpositioning are its own dependencies, which aqtinstall does not
      # auto-resolve — without them find_package(Qt6 ... WebEngineQuick) fails at
      # configure time. qtmultimedia is required by the parent apps.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: qtmultimedia qtwebengine qtwebchannel qtpositioning
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      - name: update version
        shell: bash
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      # The .pro post-link runs windeployqt, so each app's bin\ ends up
      # install-ready and smsi.ps1 can stage it directly.
      - name: make seamly2d.exe and seamlyme.exe
        run: |
          qmake Seamly.pro -config release CONFIG+=noTests
          nmake

      # ------------------- SeamlyLayout ------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout

      - name: Install Ninja
        run: choco install ninja -y

      # One CMake build produces both the Rust bridge (Corrosion/cxx-qt) and the
      # C++/QML app, against the same Qt kit installed above.
      - name: Build SeamlyLayout release
        working-directory: src/app/seamlylayout/qt_frontend
        shell: pwsh
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------- package ------------------------------------------
      # Pinned to WiX v6: v7 (July 2026) refuses to run until an Open Source
      # Maintenance Fee (OSMF) EULA is accepted (error WIX7015), a policy
      # decision this project has not made. Extension versions must match the
      # core tool: UI supplies the directory chooser, Util supplies
      # RemoveFolderEx (used to remove a previous NSIS installation).
      - name: Install WiX toolset (v6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version '6.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixVer = (wix --version).ToString().Split('+')[0]
          wix extension add --global WixToolset.UI.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # smsi.ps1 stages the shared Qt runtime, builds the MSI, runs the ICE
      # checks and the install-time authoring test, and fails the job on any of
      # them. Output: scripts\seamly-msi\x64\seamly-x64.msi
      - name: Build MSI (all three apps)
        shell: pwsh
        run: |
          .\scripts\packaging\windows\smsi.ps1 -Arch x64 -Version $env:VERSION_NUMBER `
            -Seamly2DBin src\app\seamly2d\bin `
            -SeamlyMeBin src\app\seamlyme\bin `
            -WinDeployQt6 "$env:QT_ROOT_DIR\bin\windeployqt6.exe"

      # ------------------- sign (main builds only) --------------------------
      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Set up Java (for signing)
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # jsign signs MSI files the same way it signs the NSIS exe above.
      - name: Sign the MSI
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          scripts/seamly-msi/x64/seamly-x64.msi

      # The artifact name is the file name, so the publish job's
      # download-artifact drops seamly-x64.msi straight into its working
      # directory and can list it verbatim in the release files.
      - uses: actions/upload-artifact@v7
        with:
          name: seamly-x64.msi
          path: scripts/seamly-msi/x64/seamly-x64.msi
          if-no-files-found: error

  # Publishes the installer artifacts as a GitHub PRE-RELEASE (Task Installer.1).
  #
  # The ref is `run-seamlyLayout`, NOT `develop`: origin/develop is kept as a
  # pristine mirror of the upstream FashionFreedom/Seamly2D develop branch for
  # the duration of the SeamlyLayout migration, so nothing is released from it.
  # run-seamlyLayout is this repository's default branch, which is also the ref
  # the weekly `schedule` trigger runs on.
  publish:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'run-seamlyLayout'
    runs-on: ubuntu-latest
    needs: [version, linux, macos, windows, windows-msi]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-x86_64.AppImage
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-macos.zip
      # Windows x64: the MSI, which ships seamly2d + seamlyme + SeamlyLayout.
      # It replaced the NSIS Seamly2D-windows.zip (Task Installer.1.1).
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-win-arm64.zip
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          name: ${{ env.VERSION_NUMBER }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
          files: |
            Seamly2D-x86_64.AppImage
            Seamly2D-macos.zip
            seamly-x64.msi
            Seamly2D-win-arm64.zip

  document:
    # Deploy Doxygen documentation for scheduled releases (schedule) and manual releases (workflow_dispatch) and pre-releases (push)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Doxygen GitHub Pages Deploy Action
        uses: DenverCoder1/doxygen-github-pages-action@a5ce84b4f3636592e0c101064b66136851c1605b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          # folder where docs are built, must match OUTPUT_DIRECTORY in Doxyfile + html
          folder: docs/html
          config_file: Doxyfile
          # target_folder must match pages config in https://github.com/FashionFreedom/Seamly2D/settings/pages
          target_folder: docs/
