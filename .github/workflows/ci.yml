name: CI

# for a description, see README.md in this folder

on:
  workflow_dispatch:
  push:
    branches:
    - run-seamlyLayout
    # This workflow builds the whole suite on four platforms and takes ~50
    # minutes, so changes that cannot possibly affect a binary must not start
    # it. Documentation lives in `project-docs/` and in `**.md` files scattered
    # through the tree; neither is a build input.
    #
    # `*.txt` is deliberately NOT ignored here — `CMakeLists.txt` is a build
    # input, and a blanket `**.txt` would silently stop building SeamlyLayout
    # whenever its CMake wiring changed.
    #
    # The filter is on `push` only. `pull_request` runs stay unfiltered so a
    # docs-only PR still reports its checks instead of hanging on a status that
    # never arrives.
    #
    # `paths-ignore` skips a push only when EVERY file it carries matches. One
    # unmatched path starts the full run, so a documentation push that also
    # touches an agent settings file still builds all four platforms.
    paths-ignore:
      - '**.md'
      - 'project-docs/**'
      - 'LICENSE'
      # Claude Code configuration. It never reaches a compiler, a linker, or
      # the MSI, but it sits outside `project-docs/` and is not `**.md`.
      - '.claude/**'
      - '.vscode/**'
  pull_request:

# A session that merges several task branches used to queue one full ~50-minute
# run per push. Only the newest run per ref is meaningful, so supersede the
# older ones instead of paying for all of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_VERSION: '6.11.1' # quotes required or YAML parser will interpret as float

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.create-version.outputs.version_number }}

    # The version number is YY.M.D.MMMM, a simple, easy-to-read "rolling release"
    # scheme. For pull requests before merge, keep a static version number.
    # YY is the year minus 2000. MMMM is the minute of the day (HH*60+MM,
    # 0-1439) - the same minutes-based encoding smsi.ps1 uses to derive the MSI
    # ProductVersion.
    # No component keeps a leading zero. A leading zero is an octal literal in
    # projectversion.cpp, and it makes the MSI DisplayVersion and the release tag
    # disagree with the version the binary reports.
    steps:
      - name: create version number
        id: create-version
        run: |
          # One date call: two calls can straddle a minute boundary.
          read -r year month day hour minute <<< "$(date +'%Y %m %d %H %M')"
          echo "version_number=$((10#$year - 2000)).$((10#$month)).$((10#$day)).$((10#$hour * 60 + 10#$minute))" >> $GITHUB_OUTPUT

  linux-test:
    if: github.event_name == 'pull_request'
    name: 'Linux: Run unit tests'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: install build dependencies
        run: |
          sudo apt update && sudo apt install -y libxerces-c-dev

      - name: build Seamly2D & SeamlyMe for tests
        run: |
          qmake Seamly.pro
          make -j$(nproc)

      - name: install test dependencies
        # xvfb use to test built application within a framebuffer
        run: |
          sudo apt update
          sudo apt install -y xvfb gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-0

      - name: run Seamly2D tests
        run: |
          xvfb-run -a make check

  # ---------------------------------------------------------------------------
  # Windows: build and RUN the unit tests, and gate both pre-releases on them.
  #
  # WHY THIS JOB EXISTS
  # Nothing else compiles src/test on a push. Every build job passes
  # CONFIG+=noTests, and linux-test is gated on pull_request, so a compile error
  # in a test file reached the branch and two CI runs went green over it
  # (tst_dataroot.cpp carried QLatin1Char('\'), an unterminated character
  # literal, 2026-08-17).
  #
  # WHAT IT GATES
  # publish-windows-dev and publish both list this job in `needs`, so a failing
  # Windows test stops the rolling dev-latest MSIs and the versioned
  # pre-release. It does NOT stop windows-msi: the packages still build and stay
  # downloadable as run artifacts, which is what you want when diagnosing the
  # failure that blocked the publish.
  #
  # WHY IT IS SEPARATE, NOT FOLDED INTO windows-msi
  # Folding it in would save a Qt install and an app build, but it would put the
  # tests on the package-critical path instead of the publish-critical path, and
  # it would run them twice - once per architecture. Separate, it runs in
  # PARALLEL with the package legs, so it adds almost nothing to wall-clock
  # time.
  #
  # x64 only. Nothing in the tests is architecture-specific, and the arm64
  # runner is the scarcer resource.
  #
  # qtmultimedia only - no qtwebengine. The qmake tree does not build
  # SeamlyLayout, so the WebEngine modules the windows-msi job installs are not
  # needed here, which makes this the cheapest Qt install in the workflow.
  # xerces-c needs no install step: the MSVC import library is vendored under
  # src/libs/xerces-c/msvc/lib.
  # ---------------------------------------------------------------------------
  windows-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Run unit tests'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          cache: true
          modules: qtmultimedia
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      # No CONFIG+=noTests, which is the entire point: src.pro then adds the
      # test subdirectory. `-config release` is not optional - the MSVC default
      # is debug_and_release, which would build the whole tree twice.
      - name: build Seamly2D, SeamlyMe and the unit tests
        run: |
          qmake Seamly.pro -config release
          nmake
      # Runs all four test binaries — Seamly2DTest, CollectionTest, ParserTest,
      # TranslationsTest. `CONFIG += testcase` in each .pro is what supplies the
      # `check` target.
      #
      # QT_QPA_PLATFORM=offscreen because a GitHub Windows runner has no
      # interactive desktop the widget tests can rely on. The Linux job reaches
      # the same place with xvfb-run.
      #
      # DIAGNOSING A FAILURE HERE IS AWKWARD, so read this before assuming the
      # log is broken: only ParserTest.pro sets `CONFIG += console`. The other
      # three link as GUI-subsystem binaries on MSVC, so a failure can arrive as
      # a bare non-zero exit code with no message. If that happens, re-run the
      # binary by hand with `-o <file>,txt` and print the file — the same trick
      # SESSION_HANDOVER.md records for SeamlyLayout's Qt frontend tests.
      - name: run the unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: nmake check

  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Linux: Build AppImage'
    runs-on: ubuntu-22.04
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install appimage dependencies
        run: |
          sudo apt update && sudo apt install -y libfuse2
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: install build dependencies
        run: |
          sudo apt update
          # install poppler-utils for pdftops, gstreamer1.0-plugins-base for QtMultimedia
          # install libxerces for xml manipulation
          sudo apt install -y poppler-utils gstreamer1.0-plugins-base libxerces-c-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: build Seamly2D appimage
        env:
          OUTPUT: Seamly2D-x86_64.AppImage  # linuxdeploy-x86_64.AppImage uses this env var as name for AppImage
        run: |
          qmake -config release CONFIG+=noTests
          make -j$(nproc)
          make INSTALL_ROOT=`pwd`/AppDir install

          cp /usr/bin/pdftops AppDir/usr/bin
          mkdir -p AppDir/usr/share/X11/xkb
          cp -r /usr/share/X11/xkb/* AppDir/usr/share/X11/xkb
          linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file=dist/seamly2d.desktop --plugin qt --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-x86_64.AppImage
          path: Seamly2D-x86_64.AppImage
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'macOS: Build'
    runs-on: macos-26
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install build dependencies
        run: |
          brew install xerces-c

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      - name: setup signing and notarization
        env:
          KEYCHAIN_FILE: ~/seamly2d.keychain
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        if: ${{ env.APPLE_SIGN_IDENTITY }}
        run: |
          security create-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security unlock-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security set-keychain-settings $KEYCHAIN_FILE
          security list-keychains -d user -s $KEYCHAIN_FILE
          echo '${{ secrets.apple_sign_certificate }}' | base64 -d -o ~/seamly2d.p12
          security import ~/seamly2d.p12 -k $KEYCHAIN_FILE -T /usr/bin/codesign -P ${{ secrets.apple_sign_certificate_password }}
          security set-key-partition-list -S apple-tool:,apple: -s -k ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          echo "APPLE_SIGN_IDENTITY=${{ secrets.apple_sign_identity }}" >> $GITHUB_ENV

          mkdir -p ~/private_keys/
          echo '${{ secrets.apple_notarize_key_content }}' > ~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8
          echo "APPLE_NOTARIZE_KEY=~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_KEY_ID=${{ secrets.apple_notarize_key_id }}" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_ISSUER_ID=${{ secrets.apple_notarize_issuer_id }}" >> $GITHUB_ENV

      - name: make Seamly2D for macos
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        run: |
          # see https://github.com/actions/runner-images/issues/7522
          echo killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
          # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
          if [ -n "$APPLE_SIGN_IDENTITY" ] ; then
            qmake Seamly.pro -config release CONFIG+=noTests CONFIG+=macSign
          else
            qmake Seamly.pro -config release CONFIG+=noTests
          fi
          make -j$(sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-macos.zip
          path: out/Seamly2D-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows MSI for x64 and arm64 
  #
  # Each WiX MSI is built by 'packaging/windows/smsi.ps1' from
  # smsi.wxs with WiX v6.
  #
  # EACH MSI shipsall three apps — seamly2d + seamlyme (qmake) and
  # SeamlyLayout (Rust + CMake/Ninja) — against ONE Qt 6.11.1 runtime.
  #
  # EACH ARCH BUILDS NATIVELY ON ITS OWN RUNNER : x64 on windows-latest 
  # with the win64_msvc2022_64 kit, arm64 on windows-11-arm with
  # the windows_arm64 host and the win64_msvc2022_arm64 kit. NOTHING IS
  # CROSS-COMPILED. Both run the same plain `qmake`, the same cargo host 
  # toolchain, and the same smsi.ps1 invocation — each differs only in the 
  # runner, the MSVC arch, and the Qt host/arch names.
  # ---------------------------------------------------------------------------
  windows-msi:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Build MSI (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}
    strategy:
      # One arch failing must not cancel the other: the publish job needs to
      # know whether BOTH packages are broken or only one.
      fail-fast: false
      matrix:
        include:
          # qt-modules is IDENTICAL for both arches: qtmultimedia for the
          # parent apps, and qtwebengine (SvgCanvas.qml's WebEngineView) plus
          # its dependencies qtwebchannel/qtpositioning for SeamlyLayout —
          # aqtinstall does not auto-resolve a module's Qt dependencies, and
          # without them find_package(Qt6 ... WebEngineQuick) fails at
          # configure time.
          - arch: x64
            runner: windows-latest
            msvc-arch: x64
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-modules: qtmultimedia qtwebengine qtwebchannel qtpositioning
          - arch: arm64
            runner: windows-11-arm
            msvc-arch: arm64
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            qt-modules: qtmultimedia qtwebengine qtwebchannel qtpositioning

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc-arch }}

      # ONE Qt install for every app in the package. 
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: ${{ matrix.qt-modules }}
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      - name: update version
        shell: bash
        run: |
          ./scripts/version.sh ${VERSION_NUMBER}

      # The .pro post-link runs windeployqt, so each app's bin\ ends up
      # install-ready and smsi.ps1 can stage it directly. 
      - name: make seamly2d.exe and seamlyme.exe
        run: |
          qmake Seamly.pro -config release CONFIG+=noTests
          nmake

      # ------------------- SeamlyLayout (both arches) ----------------------
      # No `targets:` and no explicit cargo target: each runner's default host 
      # toolchain already matches the package it is building.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout
          # Keeps the two legs from sharing one cache key across architectures.
          key: ${{ matrix.arch }}

      - name: Install Ninja
        run: choco install ninja -y

      # One CMake build produces both the Rust bridge (Corrosion/cxx-qt) and the
      # C++/QML app, against the same Qt kit installed above.
      - name: Build SeamlyLayout release
        working-directory: src/app/seamlylayout/qt_frontend
        shell: pwsh
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------- package ------------------------------------------
      # Pinned to WiX v6: v7 (July 2026) refuses to run until an Open Source
      # Maintenance Fee (OSMF) EULA is accepted (error WIX7015). 
      # Extension versions must match the core tool: 
      # UI supplies the directory chooser, 
      # Util supplies RemoveFolderEx (removes a previous NSIS installation).
      - name: Install WiX toolset (v6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version '6.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixVer = (wix --version).ToString().Split('+')[0]
          wix extension add --global WixToolset.UI.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # smsi.ps1 stages the shared Qt runtime, builds the MSI, runs the ICE
      # checks and the install-time authoring test, and fails the job on any of
      # them. Output: 'packaging\windows\seamly-msi\<arch>\seamly-<arch>.msi'
      - name: Build MSI (all three apps)
        shell: pwsh
        run: |
          .\packaging\windows\smsi.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION_NUMBER `
            -Seamly2DBin src\app\seamly2d\bin `
            -SeamlyMeBin src\app\seamlyme\bin `
            -WinDeployQt "$env:QT_ROOT_DIR\bin\windeployqt.exe"

      # ------------------- sign (main builds only) --------------------------
      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Set up Java (for signing)
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # jsign signs an MSI the same way it used to sign the NSIS exe.
      - name: Sign the MSI
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          packaging/windows/seamly-msi/${{ matrix.arch }}/seamly-${{ matrix.arch }}.msi

      # download-artifact extracts the archive, so both publish jobs get
      # seamly-<arch>.msi. The artifact name repeats the file name only so the
      # two match.
      # GitHub workflow artifacts are downloadable as a zip file.
      # Releases are downloadable as .msi (not msi.zip)
      - uses: actions/upload-artifact@v7
        with:
          name: seamly-${{ matrix.arch }}.msi
          path: packaging/windows/seamly-msi/${{ matrix.arch }}/seamly-${{ matrix.arch }}.msi
          if-no-files-found: error

  # Publish the Windows MSIs to one rolling pre-release for testing..
  publish-windows-dev:
    if: github.event_name == 'push' && github.ref_name == 'run-seamlyLayout'
    runs-on: ubuntu-latest
    needs: [version, windows-msi, windows-test]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: seamly-arm64.msi

      # Replace the windows rolling pre-release instead of editing it.
      # The delete leaves a gap of a few seconds with no dev-latest. A run
      # cancelled inside that gap leaves none until the next push.
      - name: Replace the rolling Windows pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          cat > notes.md <<EOF
          Windows installers built from the newest \`run-seamlyLayout\` commit.

          - Version: ${VERSION_NUMBER}
          - Commit: ${GITHUB_SHA}

          Every push to \`run-seamlyLayout\` replaces this pre-release of windows MSIs only.
          EOF

          gh release create dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Windows development build ${VERSION_NUMBER}" \
            --notes-file notes.md \
            seamly-x64.msi seamly-arm64.msi

  # Publish the installer artifacts
  publish:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'run-seamlyLayout'
    runs-on: ubuntu-latest
    needs: [version, linux, macos, windows-msi, windows-test]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-x86_64.AppImage
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-macos.zip
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: seamly-arm64.msi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          name: ${{ env.VERSION_NUMBER }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
          files: |
            Seamly2D-x86_64.AppImage
            Seamly2D-macos.zip
            seamly-x64.msi
            seamly-arm64.msi

  # update doxygen files and deploy to gh-pages branch 
  document:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Doxygen GitHub Pages Deploy Action
        uses: DenverCoder1/doxygen-github-pages-action@a5ce84b4f3636592e0c101064b66136851c1605b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          # folder where docs are built, must match OUTPUT_DIRECTORY in Doxyfile + html
          folder: docs/html
          config_file: Doxyfile
          # target_folder must match pages config in https://github.com/FashionFreedom/Seamly2D/settings/pages
          target_folder: docs/
