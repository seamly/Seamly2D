name: CI

# for a description, see README.md in this folder

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - run-seamlyLayout
    # This workflow builds the whole suite on four platforms and takes ~50
    # minutes, so changes that cannot possibly affect a binary must not start
    # it. Documentation lives in `project-docs/` and in `**.md` files scattered
    # through the tree; neither is a build input.
    #
    # `*.txt` is deliberately NOT ignored here — `CMakeLists.txt` is a build
    # input, and a blanket `**.txt` would silently stop building SeamlyLayout
    # whenever its CMake wiring changed.
    #
    # The filter is on `push` only. `pull_request` runs stay unfiltered so a
    # docs-only PR still reports its checks instead of hanging on a status that
    # never arrives.
    #
    # `paths-ignore` skips a push only when EVERY file it carries matches. One
    # unmatched path starts the full run, so a documentation push that also
    # touches an agent settings file still builds all four platforms.
    paths-ignore:
      - '**.md'
      - 'project-docs/**'
      - 'LICENSE'
      # Claude Code configuration. It never reaches a compiler, a linker, or
      # the MSI, but it sits outside `project-docs/` and is not `**.md`.
      - '.claude/**'
      - '.vscode/**'


# Keep only the newest run for each ref to avoid redundant ~50-minute builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_VERSION: '6.11.1' # quotes required or YAML parser will interpret as float

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      # Version: YY.M.D.mmmm (YY=year-2000, mmmm=minute of day 0-1439).
      # No leading zeros. For pull requests, keep static version. 
      version_number: ${{ steps.create-version.outputs.version_number }}
    steps:
      - name: create version number
        id: create-version
        run: |
          # get year month day hour minutes
          read -r year month day hour minute <<< "$(date +'%Y %m %d %H %M')"
          # convert to year month day minutes (matches semantic versioning scheme Major.Minor.Patch.Qualifier)
          echo "version_number=$((10#$year - 2000)).$((10#$month)).$((10#$day)).$((10#$hour * 60 + 10#$minute))" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Linux unit tests. 
  # Runs only on pull requests.
  # Uses xvfb-run to simulate a display for GUI tests.
  linux-test:
    if: github.event_name == 'pull_request'
    name: 'Linux: Run unit tests'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: install build dependencies
        run: |
          sudo apt update && sudo apt install -y libxerces-c-dev

      - name: build Seamly2D & SeamlyMe for tests
        run: |
          qmake Seamly.pro
          make -j$(nproc)

      - name: install test dependencies
        # xvfb use to test built application within a framebuffer
        run: |
          sudo apt update
          sudo apt install -y xvfb gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-0

      - name: run Seamly2D tests
        run: |
          xvfb-run -a make check

  # ---------------------------------------------------------------------------
  # Windows x64 unit tests. 
  # Runs on non-pull request events and non-Weblate events. 
  # Gates publishing jobs without blocking MSI builds -- runs in parallel with package jobs. 
  # `qtmultimedia` is sufficient for testing, and `xerces-c` is provided in the repo.
  windows-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Run unit tests'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          cache: true
          modules: qtmultimedia
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  # TODO: Remove once aqtinstall 3.4.0 is released, see https://github.com/miurahr/aqtinstall/issues/1007

      # Build with tests enabled. MSVC requires explicit parameter
      # `-config release` to avoid the `debug_and_release` double build.
      - name: build Seamly2D, SeamlyMe and the unit tests
        run: |
          qmake Seamly.pro -config release
          nmake
      # Run the four test binaries: Seamly2DTest, CollectionTest, ParserTest,
      # and TranslationsTest. `CONFIG += testcase` in each .pro adds the `check` target.
      # `QT_QPA_PLATFORM: offscreen` avoids needing a desktop on GitHub Windows
      # runners (linux job uses `xvfb-run`).
      - name: run the unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: nmake check


  # ---------------------------------------------------------------------------
  # Build Linux APPIMAGE.
  # For x64 arch.
  # TODO: implement for arm64 arch.
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Linux: Build AppImage'
    runs-on: ubuntu-22.04
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install appimage dependencies
        run: |
          sudo apt update && sudo apt install -y libfuse2
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-x86_64.AppImage
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: install build dependencies
        run: |
          sudo apt update
          # install poppler-utils for pdftops, gstreamer1.0-plugins-base for QtMultimedia
          # install libxerces for xml manipulation
          sudo apt install -y poppler-utils gstreamer1.0-plugins-base libxerces-c-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: update version
        run: |
          ./packaging/version.sh ${VERSION_NUMBER}

      - name: build Seamly2D appimage
        env:
          OUTPUT: Seamly2D-x86_64.AppImage  # linuxdeploy-x86_64.AppImage uses this env var as name for AppImage
        run: |
          qmake -config release CONFIG+=noTests
          make -j$(nproc)
          make INSTALL_ROOT=`pwd`/AppDir install

          cp /usr/bin/pdftops AppDir/usr/bin
          mkdir -p AppDir/usr/share/X11/xkb
          cp -r /usr/share/X11/xkb/* AppDir/usr/share/X11/xkb
          linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file=packaging/assets/seamly2d.desktop --plugin qt --output appimage

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-x86_64.AppImage
          path: Seamly2D-x86_64.AppImage
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # Build MacOS DMGs.
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'macOS: Build'
    runs-on: macos-26
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/checkout@v7

      - name: install build dependencies
        run: |
          brew install xerces-c ninja

      # qtwebengine/qtwebchannel/qtpositioning are for SeamlyLayout's
      # WebEngineView provides SvgCanvas.qml; qtmultimedia is for the 
      # parent apps. Matches the windows-msi job's module list.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia qtwebengine qtwebchannel qtpositioning

      - name: update version
        run: |
          ./packaging/version.sh ${VERSION_NUMBER}

      # Build SeamlyLayout with CMake/Ninja and Rust's Corrosion, then 
      # package the Qt app. The macOS deploy step runs automatically 
      # after the build.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout

      - name: Build SeamlyLayout release
        working-directory: src/app/seamlylayout/qt_frontend
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build --preset release

      - name: setup signing and notarization
        env:
          KEYCHAIN_FILE: ~/seamly2d.keychain
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        if: ${{ env.APPLE_SIGN_IDENTITY }}
        run: |
          security create-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security unlock-keychain -p ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          security set-keychain-settings $KEYCHAIN_FILE
          security list-keychains -d user -s $KEYCHAIN_FILE
          echo '${{ secrets.apple_sign_certificate }}' | base64 -d -o ~/seamly2d.p12
          security import ~/seamly2d.p12 -k $KEYCHAIN_FILE -T /usr/bin/codesign -P ${{ secrets.apple_sign_certificate_password }}
          security set-key-partition-list -S apple-tool:,apple: -s -k ${{ secrets.apple_keychain_password }} $KEYCHAIN_FILE
          echo "APPLE_SIGN_IDENTITY=${{ secrets.apple_sign_identity }}" >> $GITHUB_ENV

          mkdir -p ~/private_keys/
          echo '${{ secrets.apple_notarize_key_content }}' > ~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8
          echo "APPLE_NOTARIZE_KEY=~/private_keys/AuthKey_${{ secrets.apple_notarize_key_id }}.p8" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_KEY_ID=${{ secrets.apple_notarize_key_id }}" >> $GITHUB_ENV
          echo "APPLE_NOTARIZE_ISSUER_ID=${{ secrets.apple_notarize_issuer_id }}" >> $GITHUB_ENV

      - name: make Seamly2D for macos
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.apple_sign_identity }}
        run: |
          # see https://github.com/actions/runner-images/issues/7522
          echo killing XProtect...; sudo pkill -9 XProtect >/dev/null || true;
          # run signing part if secrets are available (main builds), otherwise (3rd party PRs etc) skip
          if [ -n "$APPLE_SIGN_IDENTITY" ] ; then
            qmake Seamly.pro -config release CONFIG+=noTests CONFIG+=macSign
          else
            qmake Seamly.pro -config release CONFIG+=noTests
          fi
          make -j$(sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v7
        with:
          name: Seamly2D-macos.zip
          path: packaging/macos/Seamly2D-macos.zip
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # Build Windows MSIs. 
  # For x64 and arm64 arches.
  windows-msi:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate'
    name: 'Windows: Build MSI (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    needs: version
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}
    strategy:
      # Matrix for MSI builds by architecture.
      # Keep all arch jobs running; the publish job needs both results.
      fail-fast: false
      matrix:
        include:
          # qt-modules are identical for both arches. Include qtmultimedia,
          # qtwebengine, qtwebchannel, and qtpositioning since aqtinstall
          # does not auto-resolve Qt module dependencies.
          - arch: x64
            runner: windows-latest
            msvc-arch: x64
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-modules: qtmultimedia qtwebengine qtwebchannel qtpositioning
          - arch: arm64
            runner: windows-11-arm
            msvc-arch: arm64
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            qt-modules: qtmultimedia qtwebengine qtwebchannel qtpositioning

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc-arch }}

      # ----- Install Qt -----
      # two separate Qt kit installs, one per arch
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          modules: ${{ matrix.qt-modules }}
          # TODO: Remove next line once aqtinstall 3.4.0 is released
          # see https://github.com/miurahr/aqtinstall/issues/1007
          aqtsource: git+https://github.com/miurahr/aqtinstall.git  

      - name: update version
        shell: bash
        run: |
          ./packaging/version.sh ${VERSION_NUMBER}

      # ----- Build Seamly2D & SeamlyMe -----
      # Uses qmake with Seamly.pro plus src/app/seamly2d & 
      # src/app/seamlyme subdirectory .pro files. 
      - name: make seamly2d.exe and seamlyme.exe
        run: |
          qmake Seamly.pro -config release CONFIG+=noTests
          nmake

      # ----- Build SeamlyLayout -----
      # Install Rust build tools, Cargo package manager (includes CXX-Qt 
      # to create bridge from Rust to C++/QML), and Ninja.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/app/seamlylayout
          # Separate arch keys prevent the two arches from sharing cache data.
          key: ${{ matrix.arch }}

      - name: Install Ninja
        run: choco install ninja -y

      # Build the Rust bridge and C++/QML app executable with CMakeLists.txt.
      - name: Build SeamlyLayout release
        working-directory: src/app/seamlylayout/qt_frontend
        shell: pwsh
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ----- Create MSI installer -----
      # TODO: upgrade to WiX v7 (July 2026) when feasible; v7 refuses to run 
      # until an Open Source Maintenance Fee (OSMF) EULA is accepted (error WIX7015). 
      # Applicable when we exceed $10K in annual sales + donations.
      # TODO: when v7 is adopted, upgrade the WiX extensions: 
      #     UI - provides the directory chooser.
      #     Util - provides RemoveFolderEx which removes a previous NSIS installation.

      # Install WIX
      - name: Install WiX toolset (v6)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version '6.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixVer = (wix --version).ToString().Split('+')[0]
          wix extension add --global WixToolset.UI.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/$wixVer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build MSI file 
      # Uses `packaging/windows/smsi.ps1` -- stages Qt, builds & tests the MSI, 
      # and outputs the installer MSI file to `packaging/windows/seamly-msi/x64/seamly-x64.msi`
      # and `packaging/windows/seamly-msi/arm64/seamly-arm64.msi`.
      - name: Build MSI (all three apps)
        shell: pwsh
        run: |
          .\packaging\windows\smsi.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION_NUMBER `
            -Seamly2DBin src\app\seamly2d\bin `
            -SeamlyMeBin src\app\seamlyme\bin `
            -SeamlyLayoutBuildDir src\app\seamlylayout\qt_frontend\build\Release `
            -WinDeployQt "$env:QT_ROOT_DIR\bin\windeployqt.exe"

      # ----- Sign MSI file -----
      - name: Authenticate to Google Cloud (for signing)
        uses: google-github-actions/auth@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        with:
          credentials_json: ${{ secrets.SEAMLY_SIGNING_SA_KEY }}
          project_id: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Setup Google Cloud CLI (for signing)
        uses: google-github-actions/setup-gcloud@v3
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}

      - name: Set up Java (for signing)
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # jsign signs an MSI the same way it used to sign the NSIS exe.
      - name: Sign the MSI
        env:
          SEAMLY_SIGNING_PROJECT_ID: ${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}
        # run signing part if secrets are available (main builds), otherwise skip
        if: ${{ env.SEAMLY_SIGNING_PROJECT_ID }}
        shell: bash
        run: |
          java -jar .github/workflows/signing/jsign.jar \
          --storetype GOOGLECLOUD \
          --storepass "$(gcloud auth print-access-token)" \
          --keystore "projects/${{ secrets.SEAMLY_SIGNING_PROJECT_ID }}/locations/${{ secrets.SEAMLY_SIGNING_LOCATION }}/keyRings/${{ secrets.SEAMLY_SIGNING_KEYRING_NAME }}" \
          --alias "${{ secrets.SEAMLY_SIGNING_KEY_NAME }}" \
          --certfile .github/workflows/signing/codesign-chain.pem \
          --tsaurl http://timestamp.sectigo.com \
          packaging/windows/seamly-msi/${{ matrix.arch }}/seamly-${{ matrix.arch }}.msi

      # ----- Upload MSI -----
      # Both publish jobs need the extracted MSI file; the artifact name must match the file name.
      - uses: actions/upload-artifact@v7
        with:
          name: seamly-${{ matrix.arch }}.msi
          path: packaging/windows/seamly-msi/${{ matrix.arch }}/seamly-${{ matrix.arch }}.msi
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # Publish artifacts.
    
  # ----- Publish ONLY MSIs to PRE-RELEASE (for testing) for any branch on push events
  publish-windows-dev:
    if: (github.event_name == 'push')
    runs-on: ubuntu-latest
    needs: [version, windows-msi, windows-test]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: seamly-arm64.msi

      # Replace the rolling pre-release MSI files so dev-latest always contains
      # the newest Windows MSIs. The delete leaves a gap of a few seconds with 
      # no dev-latest. A run cancelled inside that gap leaves none until the next 
      # push. This risk is acceptable as pre-release is only for development and 
      # testing purposes.
      - name: Replace the rolling Windows pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          cat > notes.md <<EOF
          Windows installers built from the newest \`run-seamlyLayout\` commit.

          - Version: ${VERSION_NUMBER}
          - Commit: ${GITHUB_SHA}

          Every push to \`run-seamlyLayout\` replaces this pre-release of windows MSIs only.
          EOF

          gh release create dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Windows development build ${VERSION_NUMBER}" \
            --notes-file notes.md \
            seamly-x64.msi seamly-arm64.msi


  # ----- Publish ALL ARTIFACTS to PRE-RELEASE (for testing) for any branch on manual events
  publish-all-dev:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [version, linux, macos, windows-msi, windows-test]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-x86_64.AppImage
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-macos.zip
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: seamly-arm64.msi

      # Separate rolling tag from publish-windows-dev's dev-latest (Windows-only,
      # every push). This tag covers all platforms and only runs on manual dispatch.
      - name: Replace the rolling all-platform pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest-full --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          cat > notes.md <<EOF
          All-platform installers built from the newest \`run-seamlyLayout\` commit.

          - Version: ${VERSION_NUMBER}
          - Commit: ${GITHUB_SHA}

          Manually triggered via workflow_dispatch. Replaces the previous all-platform pre-release.
          EOF

          gh release create dev-latest-full \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "All-platform development build ${VERSION_NUMBER}" \
            --notes-file notes.md \
            Seamly2D-x86_64.AppImage Seamly2D-macos.zip seamly-x64.msi seamly-arm64.msi


  # ----- Publish ALL ARTIFACTS to RELEASE for specified branches on scheduled events 
  publish:
    if: (github.event_name == 'schedule' && github.ref_name == 'run-seamlyLayout')
    runs-on: ubuntu-latest
    needs: [version, linux, macos, windows-msi, windows-test]
    env:
      VERSION_NUMBER: ${{ needs.version.outputs.version_number }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-x86_64.AppImage
      - uses: actions/download-artifact@v8
        with:
          name: Seamly2D-macos.zip
      - uses: actions/download-artifact@v8
        with:
          name: seamly-x64.msi
      - uses: actions/download-artifact@v8
        with:
          name: seamly-arm64.msi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          name: ${{ env.VERSION_NUMBER }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: false
          files: |
            Seamly2D-x86_64.AppImage
            Seamly2D-macos.zip
            seamly-x64.msi
            seamly-arm64.msi


  # ---------------------------------------------------------------------------
  # Update doxygen files.
  # Deploy to gh-pages for specified branches on scheduled or manual events.
  document:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == 'run-seamlyLayout'
    runs-on: ubuntu-latest

    steps:
      - name: Doxygen GitHub Pages Deploy Action
        uses: DenverCoder1/doxygen-github-pages-action@a5ce84b4f3636592e0c101064b66136851c1605b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          # folder where docs are built, must match OUTPUT_DIRECTORY in Doxyfile + html
          folder: docs/html
          config_file: Doxyfile
          # target_folder must match pages config at `https://github.com/seamly/Seamly2D/settings/pages
          target_folder: docs/
          # see doxygen site at https://seamly.github.io/Seamly2D/doxygen/
