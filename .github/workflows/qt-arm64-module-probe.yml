name: Qt arm64 module probe

# ---------------------------------------------------------------------------
# Answers one question, authoritatively: which Qt modules does Qt actually
# PUBLISH for the Windows arm64 cross-compilation kit?
#
# WHY THIS EXISTS (Task InstWinArm64.3):
#   SeamlyLayout requires Qt WebEngine (SvgCanvas.qml's WebEngineView, and
#   QtWebEngineQuick::initialize() in main.cpp), so the arm64 MSI ships only
#   seamly2d + seamlyme (smsi.ps1 -NoSeamlyLayout). The stated reason is that Qt
#   publishes no arm64 Windows WebEngine — but that has been taken on trust from
#   documentation and forum posts, and it decides whether InstWinArm64.3's
#   from-source Chromium build is necessary at all.
#
#   jurplel/install-qt-action is a front end to aqtinstall, which can only
#   download what Qt publishes to its mirrors. So aqtinstall's own listing IS
#   the answer: if `qtwebengine` appears for the arm64 kit, InstWinArm64.3 is
#   unnecessary and arm64 becomes the three-line change in InstWinArm64.1.3
#   (add the modules, drop the `arch == 'x64'` step guards, drop
#   -NoSeamlyLayout). If it does not appear, the from-source build is confirmed
#   as the only route and the decision rests on evidence rather than inference.
#
# This is a manual, read-only probe: workflow_dispatch only, no build, no
# artifact, nothing pushed. It downloads nothing but package metadata and takes
# about a minute. Delete it once InstWinArm64.3 is settled.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with ci.yml / seamlylayout-ci.yml.
  QT_VERSION: '6.11.1'

jobs:

  probe:
    name: 'List published Qt modules per Windows arch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same source ci.yml's arm64 legs pin for install-qt-action, so the
      # listing matches what those jobs would actually be able to install.
      - name: Install aqtinstall
        run: pip install git+https://github.com/miurahr/aqtinstall.git

      # aqt takes HOST and TARGET as two positional arguments. The hosts it
      # accepts are: linux, linux_arm64, mac, windows, windows_arm64, all_os.
      # Two of them matter here:
      #   windows       — the x64 host, which is what the GitHub runner is. The
      #                   arm64 kit published under it is a CROSS-COMPILED one
      #                   (win64_msvc2022_arm64_cross_compiled), and that is
      #                   what ci.yml's arm64 leg installs.
      #   windows_arm64 — a NATIVE arm64 host kit. It cannot be installed on the
      #                   x64 runner, but if it publishes qtwebengine then an
      #                   arm64 WebEngine binary exists after all, and the route
      #                   becomes "build on arm64 hardware" rather than
      #                   InstWinArm64.3's from-source Chromium build.
      # Every step is `|| true`: a kit that publishes nothing is a result, not
      # an error, and the shell runs with `-e`.
      - name: Architectures published for host windows
        run: aqt list-qt windows desktop --arch ${QT_VERSION} || true

      - name: Architectures published for host windows_arm64
        run: aqt list-qt windows_arm64 desktop --arch ${QT_VERSION} || true

      # The kit ci.yml's x64 MSI leg uses. Expected to list qtwebengine — this
      # is the control, proving the probe reports modules correctly.
      - name: Modules for win64_msvc2022_64 (x64 - control)
        run: aqt list-qt windows desktop --modules ${QT_VERSION} win64_msvc2022_64 || true

      # The kit ci.yml's arm64 MSI leg uses. THIS is the question: is
      # qtwebengine in this list?
      - name: Modules for win64_msvc2022_arm64_cross_compiled (arm64 - the question)
        run: aqt list-qt windows desktop --modules ${QT_VERSION} win64_msvc2022_arm64_cross_compiled || true

      # Same question for every arch the native arm64 host publishes.
      - name: Modules for every host windows_arm64 arch
        run: |
          for arch in $(aqt list-qt windows_arm64 desktop --arch ${QT_VERSION} 2>/dev/null || true); do
            echo "--- windows_arm64 / ${arch} ---"
            aqt list-qt windows_arm64 desktop --modules ${QT_VERSION} "${arch}" || true
          done

      # A plain verdict, so the answer is readable without scrolling the log.
      # Never fails the job: "absent" is a legitimate result, not an error.
      - name: Verdict
        run: |
          cross=$(aqt list-qt windows desktop --modules ${QT_VERSION} \
                    win64_msvc2022_arm64_cross_compiled 2>/dev/null || true)
          native=$(for arch in $(aqt list-qt windows_arm64 desktop --arch ${QT_VERSION} 2>/dev/null || true); do
                     aqt list-qt windows_arm64 desktop --modules ${QT_VERSION} "${arch}" 2>/dev/null || true
                   done)

          if echo "${cross}" | tr ' ' '\n' | grep -qx 'qtwebengine'; then
            echo "RESULT: qtwebengine IS published for the CROSS-COMPILED arm64 kit."
            echo "InstWinArm64.3 (from-source Chromium build) is NOT needed - do InstWinArm64.1.3 instead."
          elif echo "${native}" | tr ' ' '\n' | grep -qx 'qtwebengine'; then
            echo "RESULT: qtwebengine is NOT in the cross-compiled kit, but IS published for the"
            echo "NATIVE windows_arm64 host. A prebuilt arm64 WebEngine exists - so the route is to"
            echo "build SeamlyLayout ON arm64 hardware, not to build Chromium from source."
            echo "Re-scope InstWinArm64.3 before spending anything on it."
          else
            echo "RESULT: qtwebengine is published for NEITHER the cross-compiled arm64 kit nor the"
            echo "native windows_arm64 host."
            echo "InstWinArm64.3 (from-source Chromium build) is confirmed as the only route."
          fi
