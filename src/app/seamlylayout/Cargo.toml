[workspace]
members = [
    "crates/app_core",
    "crates/svg_dom",
    "crates/geometry",
    "crates/pack_types",
    "crates/layout_engine",
    "crates/polygon_pack",
    "crates/packing",
    "crates/layout_tiling",
    "crates/cli",
    "crates/seamly_svg2ezdxf",
    "crates/ezdxf2dxfastm",
    "crates/cxxqt_bridge",
]
resolver = "2"

[workspace.dependencies]
cxx-qt       = "0.7"
cxx-qt-lib   = "0.7"
cxx-qt-build = "0.7"
