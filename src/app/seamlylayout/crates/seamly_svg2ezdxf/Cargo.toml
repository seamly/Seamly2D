[package]
name = "seamly_svg2ezdxf"
version = "0.1.0"
edition = "2021"
authors = ["slspencer"]
license = "MIT"
description = "Convert SVG DOM to ezdxf-like intermediate representation for DXF export"

[dependencies]
svg_dom = { path = "../svg_dom" }
geometry = { path = "../geometry" }
xmltree = "0.10"
thiserror = "1.0"

[[example]]
name = "inspect_drawing"
path = "examples/inspect_drawing.rs"

[dev-dependencies]
