# project: SeamlyLayout
# author: slspencer, copyright 2026
# MIT License: https://opensource.org/licenses/MIT
#
# layout_tiling — tiled-paper layout algorithms.
#
# Qt-free, MIT-licensed, de-linkable from the Qt frontend.  Depends only on
# the MIT Rust core crates.  Consumed by:
#   - cxxqt_bridge (Qt frontend)
#   - cli          (batch / scripting use)
#   - future non-Qt targets

[package]
name = "layout_tiling"
version = "0.1.0"
edition = "2021"
authors = ["slspencer"]
license = "MIT"
description = "Tiled-paper layout algorithms for SeamlyLayout (Qt-free, MIT)"

[dependencies]
packing       = { path = "../packing" }
svg_dom       = { path = "../svg_dom" }
xmltree       = "0.10"
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1" }
log           = "0.4"
