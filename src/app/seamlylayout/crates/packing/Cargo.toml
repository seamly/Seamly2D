# MIT License: https://opensource.org/licenses/MIT
#
# packing — bin-packing dispatcher.
#
# Single consumer-facing entry point for piece packing.  Routes based on the
# rotation trial set: orthogonal-only ({0, 180}) goes to `layout_engine`'s
# rectangle packer; anything non-orthogonal goes to `polygon_pack`'s NFP-based
# polygon-tight packer.
#
# Lives above both `layout_engine` and `polygon_pack` so the dispatcher can
# call into either without forming a cycle.  Re-exports the shared types from
# `pack_types` plus the rectangle-packer entry points so consumers depend on
# this single crate.
#
# Qt-free, MIT-licensed, de-linkable from the Qt frontend.

[package]
name = "packing"
version = "0.1.0"
edition = "2021"
authors = ["slspencer"]
license = "MIT"
description = "Bin-packing dispatcher for SeamlyLayout (Qt-free, MIT)"

[dependencies]
pack_types    = { path = "../pack_types" }
layout_engine = { path = "../layout_engine" }
polygon_pack  = { path = "../polygon_pack" }
# log — dispatcher route diagnostics ("which packer ran for this call?").
# Routed to the bridge's file logger via `init_file_logger` in `cxxqt_bridge`.
log           = "0.4"
