# project: SeamlyLayout
# author: slspencer, copyright 2026
# MIT License: https://opensource.org/licenses/MIT
#
# polygon_pack — polygon-tight irregular bin packing for pattern pieces.
#
# Hosts the No-Fit Polygon (NFP) based irregular strip nesting algorithm and
# its supporting geometry: outward polygon offset, integer-coordinate
# arithmetic, NFP / IFP construction, and the greedy NFP placer.
#
# Qt-free, MIT-licensed, de-linkable from the Qt frontend.  Consumed by:
#   - packing (the dispatcher routes non-orthogonal trial sets here)
#   - cli     (batch / scripting use, eventually)
#   - future non-Qt targets
#
# Depends on `pack_types` for the shared API surface.  The `layout_engine`
# dependency is transitional: the current `pack` body silently falls back to
# `pack_maxrects` until the real NFP implementation lands, at which point the
# layout_engine dependency can be dropped.

[package]
name = "polygon_pack"
version = "0.1.0"
edition = "2021"
authors = ["slspencer"]
license = "MIT"
description = "Polygon-tight (NFP) irregular bin packing for SeamlyLayout (Qt-free, MIT)"

[dependencies]
pack_types    = { path = "../pack_types" }
layout_engine = { path = "../layout_engine" }
geometry      = { path = "../geometry" }
xmltree       = "0.10"
thiserror     = "1.0"
# log — facade for structured timing/diagnostics emitted by the placer and
# NFP cache.  Routed to the bridge's file logger via `init_file_logger` in
# `cxxqt_bridge`; standalone tests/CLI capture nothing unless they install
# their own logger.
log           = "0.4"

# i_overlay — pure-Rust integer-coordinate polygon boolean ops (MIT/Apache).
# Provides the underlying clipping primitives used to construct No-Fit Polygons
# (orbital-sliding NFP is layered on top of i_overlay's boolean ops).
# `allow_multithreading` enables i_overlay's internal rayon parallelism for
# large clip operations; per-pair NFP parallelism is driven separately by the
# `rayon` dep below.
i_overlay = { version = "6.0", features = ["allow_multithreading"] }

# rayon — embarrassingly parallel NFP pair computation when populating the
# (piece_a, orient_a, piece_b, orient_b) cache.  Greedy Stage 1 fills the cache
# lazily and benefits little; multi-start (Stage 3) and SA (Stage 4) batch-fill
# upfront and gain measurably.
rayon = "1"
