#
# Interactive and batch tester of the Seamly2D command-line layout export.
# Standalone crate: it is not a member of the SeamlyLayout workspace, and it needs no Qt.

[package]
name = "seamlycli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "seamlycli"
path = "src/application_seamlycli.rs"

[dependencies]
iced = "0.13"
rfd = "0.15"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
