#
# Interactive and batch tester of the Seamly2D command-line layout export.
# Standalone crate: it is not a member of the SeamlyLayout workspace, and it needs no Qt.

[package]
name = "cli_test_app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "cli_test_app"
path = "src/cli_test_app.rs"

[dependencies]
iced = "0.13"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
