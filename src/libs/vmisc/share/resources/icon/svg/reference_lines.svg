        <rect x="31" y="9" width="12" height="46"/>
        <rect x="47" y="9" width="12" height="46"/>
        <rect x="91" y="9" width="12" height="46"/>
        <rect x="107" y="9" width="12" height="46"/>
        <rect x="83" y="18" width="44" height="12"/>
        <rect x="83" y="34" width="44" height="12"/>
    </g>
    <g fill="#3977d4">
        <rect x="33" y="11" width="8" height="42"/>
        <rect x="49" y="11" width="8" height="42"/>
        <rect x="93" y="11" width="8" height="42"/>
        <rect x="109" y="11" width="8" height="42"/>
        <rect x="85" y="20" width="40" height="8"/>
        <rect x="85" y="36" width="40" height="8"/>
    </g>
</svg>
