<svg xmlns="http://www.w3.org/2000/svg" width="160" height="64" viewBox="0 0 160 64">
    <!--
    @file   reference_lines.svg
    @author slspencer
    @brief  Stripe and plaid symbols for the Reference lines page of the piece dialog.
    @copyright Copyright (C) 2026 Seamly2D Project. License: GPL-3.0-or-later.

    Black rectangles lie 2 px outside each blue bar and paint first.
    The blue bars paint over them, so the plaid crossings show no inner outline.
    All edges are on whole pixels: tst_piecemarkings.cpp checks exact pixel colors.
    -->
